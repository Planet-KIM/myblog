# Alembic 설정
# 실제 DB URL은 migrations/env.py 가 app.config.settings.DATABASE_URL 에서 읽어 주입합니다.
# (여기 sqlalchemy.url 은 비워 둡니다 — .env / 환경변수 기준으로 동작)

[alembic]
script_location = migrations
prepend_sys_path = .
# 파일명 앞에 생성일시를 붙여 정렬이 쉬워지도록 함
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

# ── 로깅 ──────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

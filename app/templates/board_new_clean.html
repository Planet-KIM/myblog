{% extends "base.html" %}

{% block title %}새 글 쓰기{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/writing-enhanced.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='editor/index.css') }}">

<style>
  /* 글쓰기는 전체 화면: 사이트 헤더·푸터 숨김 (.navbar 의 display 를 이기도록 클래스 선택자) */
  body { overflow-x: hidden; }
  body > .site-nav,
  body > .site-footer { display: none !important; }
  main.container { max-width: none; width: 100%; padding: 0; margin: 0; }
</style>
{% endblock %}

{% block content %}
<div class="writing-container">
  <!-- Clean, minimal toolbar -->
  <div class="clean-toolbar">
    <div class="toolbar-left">
      <a href="/board/" class="toolbar-back"><i class="bi bi-arrow-left"></i>글 목록</a>

      <div class="word-count-display" id="wordCount">0자</div>
    </div>

    <div class="toolbar-right">
      <!-- Text color -->
      <div class="color-control">
        <label for="textColorPicker">글자</label>
        <div class="color-input-wrapper">
          <input type="color" id="textColorPicker" value="#262019" title="글자 색">
        </div>
      </div>

      <!-- Background color -->
      <div class="color-control">
        <label for="bgColorPicker">배경</label>
        <div class="color-input-wrapper">
          <input type="color" id="bgColorPicker" value="#ffffff" title="배경 색">
        </div>
      </div>

      <!-- Reset -->
      <button type="button" class="clean-btn clean-btn-secondary" id="resetColors" title="색 초기화">
        초기화
      </button>

      <div class="toolbar-divider"></div>

      <!-- Theme toggle -->
      <button type="button" class="theme-btn" id="themeToggle" title="다크 모드 전환" aria-label="다크 모드 전환">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="sunIcon">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="moonIcon" style="display: none;">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <!-- Layout switcher -->
      <div class="layout-switcher" title="본문 폭">
        <button type="button" class="layout-btn" data-layout="left"   title="왼쪽 정렬" aria-label="왼쪽 정렬"><i class="bi bi-align-start"></i></button>
        <button type="button" class="layout-btn" data-layout="center" title="가운데" aria-label="가운데"><i class="bi bi-align-center"></i></button>
        <button type="button" class="layout-btn" data-layout="full"   title="전체 폭" aria-label="전체 폭"><i class="bi bi-arrow-left-right"></i></button>
        <button type="button" class="layout-btn" data-layout="right"  title="오른쪽 정렬" aria-label="오른쪽 정렬"><i class="bi bi-align-end"></i></button>
      </div>

      <!-- Focus mode -->
      <button type="button" class="clean-btn clean-btn-secondary" id="focusToggle">
        <i class="bi bi-arrows-fullscreen"></i>집중 모드
      </button>
    </div>
  </div>

  <form id="post-form" method="post" action="/board/new">
    <!-- Minimal meta -->
    <div class="minimal-meta">
      <select id="category_id" name="category_id" required>
        {% for cat in categories %}
        <option value="{{ cat.id }}" {% if cat.id==normal_category_id %}selected{% endif %}>
          {{ cat.name }}
        </option>
        {% endfor %}
      </select>

      <input type="text" name="tags" id="tags" placeholder="태그 (쉼표로 구분)"
             value="{{ tags_value or '' }}" autocomplete="off">

      <label>
        <input type="checkbox" value="true" id="is_private" name="is_private">
        비공개
      </label>

      <label>
        <input type="checkbox" value="true" id="show_title" name="show_title" checked>
        제목 표시
      </label>

      {% include "_tag_suggestions.html" %}
    </div>

    <!-- The editor - Pure, spacious, distraction-free -->
    <div class="writing-editor-wrapper">
      <div class="writing-editor">
        <div id="editor-root" data-draft-id="{{ draft_id }}"></div>
      </div>
    </div>

    <!-- Hidden fields -->
    <input type="hidden" name="draft_id" id="draft_id" value="{{ draft_id }}">
    <input type="hidden" name="content" id="content">
    <input type="hidden" name="content_html" id="content_html">

    <!-- Fixed action bar at bottom -->
    <div class="bottom-action-bar">
      <a href="/board/" class="clean-btn clean-btn-secondary">취소</a>
      <button type="button" class="clean-btn clean-btn-secondary" id="saveDraft">임시 저장</button>
      <button type="submit" class="clean-btn clean-btn-primary">발행하기</button>
    </div>
  </form>
</div>

<!-- Focus 모드 종료 버튼 (우측 하단 고정) -->
<button type="button" id="focusExitBtn" title="집중 모드 끝내기 (ESC)">
  <i class="bi bi-fullscreen-exit"></i>집중 모드 끝내기
</button>

<script>
window.DRAFT_ID = "{{ draft_id }}";

// ── Layout switcher ─────────────────────────────────
const LAYOUT_KEY = 'contentLayout';
const wrapper = () => document.querySelector('.writing-editor-wrapper');

function applyLayout(layout) {
  const el = wrapper();
  if (!el) return;
  el.dataset.layout = layout;
  document.querySelectorAll('.layout-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.layout === layout);
  });
  localStorage.setItem(LAYOUT_KEY, layout);
}

document.querySelectorAll('.layout-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLayout(btn.dataset.layout));
});

// 저장된 레이아웃 복원 (기본값: center)
applyLayout(localStorage.getItem(LAYOUT_KEY) || 'center');

// Theme management
const html = document.documentElement;
const themeToggle = document.getElementById('themeToggle');
const sunIcon = document.getElementById('sunIcon');
const moonIcon = document.getElementById('moonIcon');

const savedTheme = localStorage.getItem('theme') || 'light';
html.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);

themeToggle.addEventListener('click', () => {
  const currentTheme = html.getAttribute('data-theme');
  const newTheme = currentTheme === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  updateThemeIcon(newTheme);
});

function updateThemeIcon(theme) {
  if (theme === 'dark') {
    sunIcon.style.display = 'none';
    moonIcon.style.display = 'block';
  } else {
    sunIcon.style.display = 'block';
    moonIcon.style.display = 'none';
  }
}

// Focus mode
const focusToggle = document.getElementById('focusToggle');
const focusExitBtn = document.getElementById('focusExitBtn');
let focusMode = false;

function enterFocus() {
  focusMode = true;
  document.body.classList.add('focus-active');
  focusExitBtn.style.display = 'flex';
}

function exitFocus() {
  focusMode = false;
  document.body.classList.remove('focus-active');
  focusExitBtn.style.display = 'none';
}

focusToggle.addEventListener('click', () => focusMode ? exitFocus() : enterFocus());
focusExitBtn.addEventListener('click', exitFocus);

// ESC로 Focus 모드 종료
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && focusMode) exitFocus();
});

// 글자 수 (공백 제외) — 에디터에 입력할 때마다 갱신
function updateWordCount(text) {
  const chars = text.replace(/\s/g, '').length;
  document.getElementById('wordCount').textContent = `${chars.toLocaleString()}자`;
}
document.addEventListener('input', (e) => {
  const pm = e.target.closest && e.target.closest('.ProseMirror');
  if (pm) updateWordCount(pm.innerText);
});

// Color management
const textColorPicker = document.getElementById('textColorPicker');
const bgColorPicker = document.getElementById('bgColorPicker');
const resetColorsBtn = document.getElementById('resetColors');

// Get editor element
function getEditor() {
  return document.querySelector('.milkdown .ProseMirror');
}

// Apply text color
function applyTextColor(color) {
  setTimeout(() => {
    const editor = getEditor();
    if (editor) {
      editor.style.setProperty('color', color, 'important');
      localStorage.setItem('editorTextColor', color);
    }
  }, 100);
}

// Apply background color
function applyBgColor(color) {
  setTimeout(() => {
    const editor = getEditor();
    const editorWrapper = document.querySelector('.writing-editor .milkdown .editor');
    const writingWrapper = document.querySelector('.writing-editor-wrapper');

    if (editor) {
      editor.style.setProperty('background', color, 'important');
      if (editorWrapper) editorWrapper.style.setProperty('background', color, 'important');
      if (writingWrapper) writingWrapper.style.setProperty('background', color, 'important');
      localStorage.setItem('editorBgColor', color);
    }
  }, 100);
}

// Color picker events
textColorPicker.addEventListener('input', (e) => {
  applyTextColor(e.target.value);
});

bgColorPicker.addEventListener('input', (e) => {
  applyBgColor(e.target.value);
});

// Reset colors — 현재 테마 토큰 값으로
resetColorsBtn.addEventListener('click', () => {
  const tokens = getComputedStyle(html);
  const defaultText = tokens.getPropertyValue('--text-primary').trim();
  const defaultBg = tokens.getPropertyValue('--surface').trim();

  textColorPicker.value = defaultText;
  bgColorPicker.value = defaultBg;

  applyTextColor(defaultText);
  applyBgColor(defaultBg);
});

// Load saved colors
const savedTextColor = localStorage.getItem('editorTextColor');
const savedBgColor = localStorage.getItem('editorBgColor');

// 저장된 색이 없으면 스와치를 현재 테마 색으로 표시
{
  const tokens = getComputedStyle(html);
  if (!savedTextColor) textColorPicker.value = tokens.getPropertyValue('--text-primary').trim();
  if (!savedBgColor) bgColorPicker.value = tokens.getPropertyValue('--surface').trim();
}

if (savedTextColor) {
  textColorPicker.value = savedTextColor;
  applyTextColor(savedTextColor);
}

if (savedBgColor) {
  bgColorPicker.value = savedBgColor;
  applyBgColor(savedBgColor);
}

// Apply colors when editor loads
setTimeout(() => {
  if (savedTextColor) applyTextColor(savedTextColor);
  if (savedBgColor) applyBgColor(savedBgColor);
}, 500);

// Reapply on editor changes
setInterval(() => {
  const editor = getEditor();
  if (editor && savedTextColor && !editor.style.color.includes(savedTextColor)) {
    applyTextColor(savedTextColor);
  }
  if (editor && savedBgColor && !editor.style.background.includes(savedBgColor)) {
    applyBgColor(savedBgColor);
  }
}, 1000);
</script>

<script type="module" src="{{ url_for('static', path='editor/board_new.js') }}?v=9"></script>
{% endblock %}

{% extends "base.html" %}

{% block title %}회원가입 · Planet KIM{% endblock %}

{% block extra_head %}
<style>
  .auth-wrap {
    max-width: 420px;
    margin: var(--space-3xl) auto var(--space-2xl);
  }
  .auth-wrap .page-card { padding: var(--space-xl); }
  .auth-head { margin-bottom: var(--space-lg); }
  .auth-head h1 { font-size: var(--fs-xl); margin: var(--space-xs) 0 var(--space-xs); }
  .auth-head p { color: var(--text-muted); font-size: var(--fs-sm); margin: 0; }
  .auth-wrap .form-text { color: var(--text-muted); font-size: var(--fs-xs); }
  .auth-submit { width: 100%; padding: 0.65rem 1.1rem; font-size: var(--fs-base); }
  .auth-alt {
    margin: var(--space-lg) 0 0;
    text-align: center;
    font-size: var(--fs-sm);
    color: var(--text-muted);
  }
  .auth-alt a { font-weight: 600; }
  @media (max-width: 575.98px) {
    .auth-wrap { margin-top: var(--space-xl); }
    .auth-wrap .page-card { padding: var(--space-lg); }
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="page-card">
    <div class="auth-head">
      <span class="eyebrow">Planet KIM</span>
      <h1>회원가입</h1>
      <p>나만의 블로그를 열고, 다른 사람들의 이야기도 만나보세요.</p>
    </div>

    {% if error %}
      <div class="alert alert-danger" role="alert">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/auth/signup">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <div class="mb-3">
        <label for="email" class="form-label">이메일</label>
        <input
          type="email"
          class="form-control"
          id="email"
          name="email"
          required
          autocomplete="email"
          value="{{ email or '' }}"
          placeholder="you@example.com"
        >
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">비밀번호</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          required
          autocomplete="new-password"
        >
        <div class="form-text">
          8자 이상, 영문/숫자/특수문자를 각각 1개 이상 포함해야 합니다.
        </div>
      </div>

      <div class="mb-4">
        <label for="password_confirm" class="form-label">비밀번호 확인</label>
        <input
          type="password"
          class="form-control"
          id="password_confirm"
          name="password_confirm"
          required
          autocomplete="new-password"
        >
      </div>

      <button type="submit" class="btn-travel auth-submit">
        계정 만들기
      </button>
    </form>
  </div>

  <p class="auth-alt">
    이미 계정이 있으신가요?
    <a href="/auth/login{% if next %}?next={{ next|urlencode }}{% endif %}">로그인</a>
  </p>
</div>
{% endblock %}

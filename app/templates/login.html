{% extends "base.html" %}

{% block title %}로그인 · Planet KIM{% endblock %}

{% block extra_head %}
<style>
  .auth-wrap {
    max-width: 420px;
    margin: var(--space-3xl) auto var(--space-2xl);
  }
  .auth-wrap .page-card { padding: var(--space-xl); }
  .auth-head { margin-bottom: var(--space-lg); }
  .auth-head h1 { font-size: var(--fs-xl); margin: var(--space-xs) 0 var(--space-xs); }
  .auth-head p { color: var(--text-muted); font-size: var(--fs-sm); margin: 0; }
  .auth-submit { width: 100%; padding: 0.65rem 1.1rem; font-size: var(--fs-base); }
  .auth-alt {
    margin: var(--space-lg) 0 0;
    text-align: center;
    font-size: var(--fs-sm);
    color: var(--text-muted);
  }
  .auth-alt a { font-weight: 600; }
  @media (max-width: 575.98px) {
    .auth-wrap { margin-top: var(--space-xl); }
    .auth-wrap .page-card { padding: var(--space-lg); }
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="page-card">
    <div class="auth-head">
      <span class="eyebrow">Planet KIM</span>
      <h1>로그인</h1>
      <p>다시 오신 걸 환영해요. 이어서 읽고 써보세요.</p>
    </div>

    {% if error %}
      <div class="alert alert-danger" role="alert">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/auth/login">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <div class="mb-3">
        <label for="email" class="form-label">이메일</label>
        <input
          type="email"
          class="form-control"
          id="email"
          name="email"
          required
          autocomplete="email"
          value="{{ email or '' }}"
          placeholder="you@example.com"
        >
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">비밀번호</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn-travel auth-submit">
        로그인
      </button>
    </form>
  </div>

  <p class="auth-alt">
    아직 계정이 없으신가요?
    <a href="/auth/signup{% if next %}?next={{ next|urlencode }}{% endif %}">회원가입</a>
  </p>
</div>
{% endblock %}

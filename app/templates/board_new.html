{% extends "base.html" %}

{% block title %}New post (Milkdown){% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', path='editor/index.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='editor/layout.css') }}">

<style>
  .editor-page-container {
    max-width: 1100px;
  }

  /* 툴바와 에디터, 제출바를 하나의 통합 블록으로 */
  .editor-block {
    display: flex;
    flex-direction: column;
    margin-bottom: 0;
  }

  .editor-card {
    border-radius: 0;
    border: 1px solid var(--border);
    border-top: none;
    border-bottom: none;
    padding: 1.5rem;
    background-color: var(--surface);
  }

  .editor-wrapper {
    border-radius: 12px;
    overflow: hidden;
    background-color: var(--surface-dark);
  }

  .editor-wrapper .crepe {
    min-height: 60vh;
  }

  .editor-wrapper .ProseMirror {
    min-height: 60vh;
  }

  /* 🔥 이미지 리사이즈 핸들 코너로 이동 */
  .milkdown .milkdown-image-block .image-wrapper {
    position: relative !important;
    display: inline-block !important;
  }

  .milkdown .milkdown-image-block .image-wrapper .image-resize-handle {
    position: absolute !important;
    left: auto !important;
    top: auto !important;
    transform: none !important;
    right: 8px !important;
    bottom: 8px !important;
    width: 18px !important;
    height: 18px !important;
    border-radius: 999px !important;
    background: rgba(15, 23, 42, 0.85) !important;
    border: 2px solid #ffffff !important;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.35) !important;
    display: flex !important;
    align-items: center;
    justify-content: center;
    cursor: se-resize !important;
    z-index: 5 !important;
    opacity: 1 !important;
  }
</style>
{% endblock %}

{% block content %}
<div class="page-content">
  <h1 class="mb-4">New post</h1>

  <form id="post-form" method="post" action="/board/new">
    <div class="editor-block">

      <!-- 상단 툴바 (카테고리, 옵션) -->
      <div class="editor-top-toolbar">
        <div class="d-flex align-items-center gap-3 flex-wrap">
          <div>
            <span class="toolbar-label">Author</span>
            <span class="toolbar-value">{{ current_user.email }}</span>
            <input type="hidden" name="author" value="{{ current_user.email }}">
          </div>

          <div>
            <label class="toolbar-label" for="category_id">Category</label>
            <select class="form-select form-select-sm toolbar-select" id="category_id" name="category_id" required>
              {% for cat in categories %}
              <option value="{{ cat.id }}" {% if cat.id==normal_category_id %}selected{% endif %}>
                {{ cat.name }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="d-flex gap-3 align-items-center">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" value="true" id="is_private" name="is_private">
              <label class="form-check-label small" for="is_private">Private</label>
            </div>
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" value="true" id="show_title" name="show_title" checked>
              <label class="form-check-label small" for="show_title">Show Title</label>
            </div>
          </div>
        </div>

        <div class="text-muted" style="font-size:0.75rem;">
          <a href="/board/categories" class="text-muted">카테고리 관리</a>
        </div>
      </div>

      <!-- 에디터 본문 -->
      <div class="editor-card">
        <div class="editor-wrapper">
          <div id="editor-root" data-draft-id="{{ draft_id }}"></div>
        </div>
      </div>

      <!-- 하단 고정 제출바 -->
      <div class="editor-submit-bar">
        <div class="editor-submit-hint">
          <i class="bi bi-info-circle me-1"></i>
          첫 번째 줄의 <code># 제목</code>이 제목으로 자동 저장됩니다
        </div>
        <div class="d-flex gap-2">
          <a href="/board/" class="btn btn-outline-secondary btn-sm">Cancel</a>
          <button type="submit" class="btn btn-primary btn-sm">
            <i class="bi bi-cloud-upload-fill me-1"></i>Submit
          </button>
        </div>
      </div>

    </div><!-- editor-block -->

    <!-- 서버로 전송될 실제 필드 -->
    <input type="hidden" name="draft_id" id="draft_id" value="{{ draft_id }}">
    <input type="hidden" name="content" id="content">
    <input type="hidden" name="content_html" id="content_html">

  </form>
</div>

<script>window.DRAFT_ID = "{{ draft_id }}";</script>
<script type="module" src="{{ url_for('static', path='editor/board_new.js') }}?v=3"></script>
{% endblock %}

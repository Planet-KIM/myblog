{% extends "base.html" %}

{% block title %}Edit - Magazine{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/tiptap-editor.css') }}">

<style>
  body { margin: 0; padding: 0; overflow-x: hidden; }
  main.container {
    max-width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
  }
  body > nav { display: none; }
</style>
{% endblock %}

{% block content %}
<div class="tiptap-container">
  <form id="post-form" method="post" action="/board/{{ post.id }}/edit">
    <!-- Toolbar -->
    <div class="tiptap-toolbar" id="tiptap-toolbar">
      <a href="/board/{{ post.id }}" style="text-decoration: none; color: inherit; font-weight: 600; font-size: 0.9rem; margin-right: 1rem;">
        ← Back
      </a>
      <div class="tiptap-toolbar-sep"></div>
      <div id="wordCount" style="font-size: 0.78rem; color: var(--text-muted, #9ca3af); margin-right: 0.5rem;">0 words</div>
      <div class="tiptap-toolbar-sep"></div>
      <!-- Toolbar buttons injected by JS -->
    </div>

    <!-- Meta -->
    <div class="tiptap-meta">
      <select id="category_id" name="category_id" required>
        {% for cat in categories %}
        <option value="{{ cat.id }}"
          {% if post.category %}{% if post.category.id == cat.id %}selected{% endif %}
          {% else %}{% if cat.id == normal_category_id %}selected{% endif %}{% endif %}>
          {{ cat.name }}
        </option>
        {% endfor %}
      </select>

      <label>
        <input type="checkbox" value="true" id="is_private" name="is_private" {% if post.is_private %}checked{% endif %}>
        Private
      </label>

      <label>
        <input type="checkbox" value="true" id="show_title" name="show_title" {% if post.show_title != False %}checked{% endif %}>
        Show title
      </label>
    </div>

    <!-- Block Canvas -->
    <div class="tiptap-editor-wrapper">
      <div id="block-canvas" data-post-id="{{ post.id }}"></div>
      <div id="page-tab-bar" class="page-tab-bar"></div>
    </div>

    <!-- Initial content (blocks JSON or HTML fallback) -->
    {% if post.content_blocks %}
    <script id="initial-blocks" type="application/json">
      {{ post.content_blocks | safe }}
    </script>
    {% else %}
    <script id="initial-content" type="application/json">
      {{ (post.content_html or post.content) | tojson | safe }}
    </script>
    {% endif %}

    <!-- Hidden fields -->
    <input type="hidden" name="editor_type" value="tiptap">
    <input type="hidden" name="content" id="content">
    <input type="hidden" name="content_html" id="content_html">
    <input type="hidden" name="content_blocks" id="content_blocks">

    <!-- Bottom bar -->
    <div class="tiptap-bottom-bar">
      <button type="submit" class="tiptap-btn tiptap-btn-primary">Update</button>
      <button type="button" class="tiptap-btn tiptap-btn-secondary tiptap-btn-preview">Preview</button>
      <a href="/board/{{ post.id }}" class="tiptap-btn tiptap-btn-secondary" style="text-decoration: none;">Cancel</a>
    </div>
  </form>
</div>

<script type="module" src="{{ url_for('static', path='editor/board_edit_tiptap.js') }}?v=3"></script>
{% endblock %}

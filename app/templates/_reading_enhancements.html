{# 글 상세 읽기 보조: 목차(TOC) 자동 생성 + 코드블록 헤더(언어·복사).
   점진적 향상이라 JS가 실패해도 본문은 그대로 보인다.
   목차는 마크다운 뷰(.article-content) 전용, 코드블록은 매거진(.magazine-content)에도 적용.
   스타일: 목차는 아래, 코드블록은 writer-journey.css(.code-block). #}
<style>
  .post-toc {
    margin: 0 0 var(--space-2xl);
    padding: var(--space-md) var(--space-lg);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    background: var(--surface);
  }
  .post-toc-title {
    font-size: var(--fs-xs);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: var(--space-sm);
  }
  .post-toc ul { list-style: none; margin: 0; padding: 0; }
  .post-toc li { margin: 0.2rem 0; }
  .post-toc li.lvl-3 { padding-left: var(--space-md); }
  .post-toc a {
    color: var(--text-main);
    text-decoration: none;
    font-size: var(--fs-sm);
    line-height: 1.55;
  }
  .post-toc a:hover { color: var(--primary); }
</style>
<script>
  (function () {
    window.__skipCodeCopy = true;   // app.js 의 범용 복사 버튼과 중복 방지

    var article = document.querySelector('.article-content');

    // ── 목차 (h2/h3) — 제목이 3개 이상일 때만 ──
    if (article) {
      var heads = article.querySelectorAll('h2, h3');
      if (heads.length >= 3) {
        var used = {};
        var toc = document.createElement('nav');
        toc.className = 'post-toc';
        toc.setAttribute('aria-label', '목차');
        var items = '';
        heads.forEach(function (h, i) {
          var text = (h.textContent || '').trim();
          if (!text) return;
          var slug = text.toLowerCase().replace(/[^\w가-힣]+/g, '-').replace(/^-+|-+$/g, '') || ('section-' + i);
          if (used[slug]) slug = slug + '-' + i;
          used[slug] = true;
          if (!h.id) h.id = slug;
          var lvl = h.tagName === 'H3' ? ' class="lvl-3"' : '';
          var a = document.createElement('a');
          a.textContent = text;          // 텍스트로 넣어 XSS 없이 안전
          items += '<li' + lvl + '><a href="#' + h.id + '">' + a.innerHTML + '</a></li>';
        });
        if (items) {
          toc.innerHTML = '<div class="post-toc-title">목차</div><ul>' + items + '</ul>';
          article.parentNode.insertBefore(toc, article);
        }
      }
    }

    // ── 코드블록: 언어 라벨 + 복사 버튼 헤더 ──
    function langOf(pre) {
      var lang = pre.getAttribute('data-language') || '';
      var code = pre.querySelector('code');
      if (!lang && code) {
        var m = (code.className || '').match(/language-([\w+#-]+)/);
        if (m) lang = m[1];
      }
      return lang && lang !== 'plaintext' ? lang : 'code';
    }

    document.querySelectorAll('.article-content pre, .magazine-content pre').forEach(function (pre) {
      if (pre.parentElement && pre.parentElement.classList.contains('code-block')) return;
      var block = document.createElement('div');
      block.className = 'code-block';
      var head = document.createElement('div');
      head.className = 'code-block-head';
      var label = document.createElement('span');
      label.textContent = langOf(pre);
      head.appendChild(label);

      if (navigator.clipboard) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'code-copy-btn';
        btn.setAttribute('aria-label', '코드 복사');
        btn.innerHTML = '<i class="bi bi-clipboard" aria-hidden="true"></i><span>복사</span>';
        btn.addEventListener('click', function () {
          navigator.clipboard.writeText(pre.innerText).then(function () {
            btn.classList.add('copied');
            btn.innerHTML = '<i class="bi bi-check2" aria-hidden="true"></i><span>복사됨</span>';
            setTimeout(function () {
              btn.classList.remove('copied');
              btn.innerHTML = '<i class="bi bi-clipboard" aria-hidden="true"></i><span>복사</span>';
            }, 1500);
          }).catch(function () {});
        });
        head.appendChild(btn);
      }

      pre.parentNode.insertBefore(block, pre);
      block.appendChild(head);
      block.appendChild(pre);
    });
  })();
</script>

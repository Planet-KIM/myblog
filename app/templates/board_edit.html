{% extends "base.html" %}

{% block title %}Edit{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/writing-enhanced.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='editor/index.css') }}">

<style>
  body { margin: 0; padding: 0; overflow-x: hidden; }
  main.container {
    max-width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
  }
  body > nav { display: none; }
</style>

<!-- FOUC 방지: layout 미리 적용 -->
<script>
  (function() {
    const layout = localStorage.getItem('contentLayout') || 'center';
    document.addEventListener('DOMContentLoaded', function() {
      const w = document.querySelector('.writing-editor-wrapper');
      if (w) w.dataset.layout = layout;
    });
  })();
</script>
{% endblock %}

{% block content %}
<div class="writing-container">
  <!-- Clean toolbar -->
  <div class="clean-toolbar">
    <div class="toolbar-left">
      <a href="/board/{{ post.id }}" style="text-decoration:none;color:inherit;font-weight:600;font-size:1rem;">
        ← Back
      </a>
      <div class="word-count-display" id="wordCount">0 words</div>
    </div>

    <div class="toolbar-right">
      <!-- Theme toggle -->
      <button class="theme-btn" id="themeToggle" title="Toggle dark mode">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="sunIcon">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="moonIcon" style="display:none;">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <!-- Layout switcher -->
      <div class="layout-switcher" title="Content layout">
        <button class="layout-btn" data-layout="left"   title="Left">&#9001;</button>
        <button class="layout-btn" data-layout="center" title="Center">&#9632;</button>
        <button class="layout-btn" data-layout="full"   title="Full width">&#9644;</button>
        <button class="layout-btn" data-layout="right"  title="Right">&#9002;</button>
      </div>

      <!-- Focus mode -->
      <button type="button" class="clean-btn clean-btn-secondary" id="focusToggle">Focus</button>
    </div>
  </div>

  <form id="post-form" method="post" action="/board/{{ post.id }}/edit">
    <!-- Meta -->
    <div class="minimal-meta">
      <select id="category_id" name="category_id" required>
        {% for cat in categories %}
        <option value="{{ cat.id }}"
          {% if post.category %}{% if post.category.id == cat.id %}selected{% endif %}
          {% else %}{% if cat.id == normal_category_id %}selected{% endif %}{% endif %}>
          {{ cat.name }}
        </option>
        {% endfor %}
      </select>

      <label>
        <input type="checkbox" value="true" id="is_private" name="is_private" {% if post.is_private %}checked{% endif %}>
        Private
      </label>

      <label>
        <input type="checkbox" value="true" id="show_title" name="show_title" {% if post.show_title != False %}checked{% endif %}>
        Show title
      </label>
    </div>

    <!-- Editor -->
    <div class="writing-editor-wrapper">
      <div class="writing-editor">
        <div id="editor-root" data-post-id="{{ post.id }}"></div>
      </div>
    </div>

    <!-- 초기 콘텐츠 (HTML) -->
    <script id="initial-content" type="application/json">
      {{ (post.content_html or post.content) | tojson | safe }}
    </script>

    <!-- Hidden fields -->
    <input type="hidden" name="content" id="content">
    <input type="hidden" name="content_html" id="content_html">

    <!-- Action bar -->
    <div class="bottom-action-bar">
      <button type="submit" class="clean-btn clean-btn-primary">Update</button>
      <a href="/board/{{ post.id }}" class="clean-btn clean-btn-secondary" style="text-decoration:none;">Cancel</a>
    </div>
  </form>
</div>

<!-- Focus 종료 버튼 -->
<button id="focusExitBtn" title="Focus 모드 종료 (ESC)">✕ Exit Focus</button>

<script>
// ── Layout switcher ──────────────────────────────────────
const LAYOUT_KEY = 'contentLayout';
function applyLayout(layout) {
  const el = document.querySelector('.writing-editor-wrapper');
  if (!el) return;
  el.dataset.layout = layout;
  document.querySelectorAll('.layout-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.layout === layout);
  });
  localStorage.setItem(LAYOUT_KEY, layout);
}
document.querySelectorAll('.layout-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLayout(btn.dataset.layout));
});
applyLayout(localStorage.getItem(LAYOUT_KEY) || 'center');

// ── Theme ────────────────────────────────────────────────
const html = document.documentElement;
const savedTheme = localStorage.getItem('theme') || 'light';
html.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);
document.getElementById('themeToggle').addEventListener('click', () => {
  const newTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  updateThemeIcon(newTheme);
});
function updateThemeIcon(theme) {
  document.getElementById('sunIcon').style.display = theme === 'dark' ? 'none' : 'block';
  document.getElementById('moonIcon').style.display = theme === 'dark' ? 'block' : 'none';
}

// ── Focus mode ───────────────────────────────────────────
const focusToggle = document.getElementById('focusToggle');
const focusExitBtn = document.getElementById('focusExitBtn');
let focusMode = false;
function enterFocus() {
  focusMode = true;
  document.body.classList.add('focus-active');
  focusExitBtn.style.display = 'flex';
}
function exitFocus() {
  focusMode = false;
  document.body.classList.remove('focus-active');
  focusExitBtn.style.display = 'none';
}
focusToggle.addEventListener('click', () => focusMode ? exitFocus() : enterFocus());
focusExitBtn.addEventListener('click', exitFocus);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && focusMode) exitFocus(); });
</script>

<script type="module" src="{{ url_for('static', path='editor/board_edit.js') }}?v=2"></script>
{% endblock %}

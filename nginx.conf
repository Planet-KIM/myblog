map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# 사용자 업로드 중 이미지·영상·음성만 브라우저에서 바로 열고, 나머지는 내려받기로.
# (app/services/upload_static.py 와 같은 규칙. 빈 값이면 헤더를 붙이지 않는다)
map $uri $upload_disposition {
    default "attachment";
    ~*\.(jpe?g|png|gif|webp|avif|mp4|webm|mov|avi|mkv|mp3|wav|ogg|m4a|flac)$ "";
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Docker 내장 DNS로 web 컨테이너 IP를 주기적으로 재조회한다.
    # proxy_pass 에 변수를 쓰면 nginx 가 요청 시점에 재조회하므로, web 컨테이너가
    # 재생성되어 IP 가 바뀌어도(배포/재빌드) 502 로 멈추지 않고 스스로 복구된다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /static/ {
        alias /app/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri @app;
    }

    # 사용자 업로드: 같은 출처에서 문서·스크립트로 실행되지 않게 샌드박스 CSP + nosniff,
    # 형식은 고정된 목록으로만 정하고 나머지는 octet-stream 내려받기
    location /static/uploads/ {
        alias /app/app/static/uploads/;
        expires 7d;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/avif avif;
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov;
            audio/mpeg mp3;
            audio/wav wav;
            audio/ogg ogg;
            audio/mp4 m4a;
            audio/flac flac;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;
        add_header Content-Disposition $upload_disposition always;
    }

    location / {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location @app {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
